name: desktop

# Builds and smoke-tests the Windows app, and lets CI pin Blender (blender.org is not
# reachable from every environment, so pinning runs here and is committed from the artifact).
on:
  push:
    branches: [main]
    paths: ["apps/desktop/**", "src/**", "web/**", "blender/**", "scripts/**", ".github/workflows/desktop.yml", "package*.json"]
  pull_request:
  workflow_dispatch:
    inputs:
      pin_blender:
        description: "Also run `npm run blender:pin` and upload releases.json"
        type: boolean
        default: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  pin-blender:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.pin_blender }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npm ci
      - run: npm run blender:pin
      - run: cat src/integrations/blender/releases.json
      - uses: actions/upload-artifact@v4
        with:
          name: releases-json
          path: src/integrations/blender/releases.json

  windows:
    needs: test
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npm ci
      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm ci
      - name: Build the installer
        working-directory: apps/desktop
        run: npm run dist
      - name: Smoke test the shell from source
        working-directory: apps/desktop
        env:
          KING3D_DESKTOP_SMOKE: "1"
          KING3D_DESKTOP_SMOKE_OUT: ${{ runner.temp }}\smoke-dev.txt
          KING3D_BLENDER_PATH: ${{ runner.temp }}\fake-blender\blender.exe
          KING3D_RUNS_DIR: ${{ runner.temp }}\runs-dev
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\fake-blender" | Out-Null
          New-Item -ItemType File -Force $env:KING3D_BLENDER_PATH | Out-Null
          npx electron . 
          Get-Content $env:KING3D_DESKTOP_SMOKE_OUT
          if (-not (Select-String -Path $env:KING3D_DESKTOP_SMOKE_OUT -Pattern "SMOKE_OK" -Quiet)) { exit 1 }
      - name: Install silently and smoke test the packaged app
        shell: pwsh
        env:
          KING3D_DESKTOP_SMOKE: "1"
          KING3D_DESKTOP_SMOKE_OUT: ${{ runner.temp }}\smoke-installed.txt
          KING3D_BLENDER_PATH: ${{ runner.temp }}\fake-blender\blender.exe
          KING3D_RUNS_DIR: ${{ runner.temp }}\runs-installed
        timeout-minutes: 10
        # `Start-Process -Wait` also waits for every child the process starts, so a silent installer that
        # launches the app (or an app that leaves a helper behind) hung the first run for hours.
        # Wait on the process id only, with a deadline, and print what is on disk if it does not finish.
        run: |
          function Show-State($why) {
            Write-Host "---- $why"
            Get-Process | Where-Object { $_.ProcessName -match "King3D|electron|Setup" } | Format-Table Id, ProcessName, StartTime -AutoSize | Out-String | Write-Host
            if (Test-Path $target) { Get-ChildItem $target | Select-Object -First 30 | ForEach-Object { Write-Host $_.Name } }
            if (Test-Path $env:KING3D_DESKTOP_SMOKE_OUT) { Get-Content $env:KING3D_DESKTOP_SMOKE_OUT } else { Write-Host "no smoke output file" }
            $log = @("King3D", "king3d-desktop") | ForEach-Object { Join-Path $env:APPDATA "$_\logs\server.log" } | Where-Object { Test-Path $_ } | Select-Object -First 1
            Write-Host "---- server.log ($log)"
            if ($log) { Get-Content $log -Tail 40 } else { Write-Host "no server.log" }
            $cli = Join-Path $target "resources\king3d\src\cli\index.ts"
            Write-Host "---- running the CLI directly ($cli)"
            if (Test-Path $cli) {
              $env:ELECTRON_RUN_AS_NODE = "1"
              $p = Start-Process -FilePath (Join-Path $target "King3D.exe") -ArgumentList $cli, "blender", "status", "--json" -PassThru -NoNewWindow -RedirectStandardOutput "$env:RUNNER_TEMP\cli.out" -RedirectStandardError "$env:RUNNER_TEMP\cli.err"
              if (-not $p.WaitForExit(60000)) { $p.Kill(); Write-Host "CLI did not finish in 60s" }
              Get-Content "$env:RUNNER_TEMP\cli.out", "$env:RUNNER_TEMP\cli.err" -ErrorAction SilentlyContinue
            } else { Write-Host "CLI file missing"; Get-ChildItem (Join-Path $target "resources") -Recurse -Depth 2 | Select-Object -First 40 | ForEach-Object { Write-Host $_.FullName } }
          }
          $installer = Get-ChildItem apps/desktop/dist -Filter "*Setup*.exe" | Select-Object -First 1
          $target = Join-Path $env:RUNNER_TEMP "King3D-installed"
          $setup = Start-Process -FilePath $installer.FullName -ArgumentList "/S", "/D=$target" -PassThru
          if (-not $setup.WaitForExit(180000)) { Show-State "installer did not finish in 180s"; $setup.Kill(); exit 1 }
          Write-Host "installer exit code: $($setup.ExitCode)"
          # an installer that starts the app itself would collide with ours (single-instance lock)
          Start-Sleep -Seconds 5
          Get-Process -Name "King3D" -ErrorAction SilentlyContinue | Stop-Process -Force
          Remove-Item $env:KING3D_DESKTOP_SMOKE_OUT -ErrorAction SilentlyContinue
          $exe = Join-Path $target "King3D.exe"
          if (-not (Test-Path $exe)) { Show-State "King3D.exe missing after install"; exit 1 }
          $app = Start-Process -FilePath $exe -PassThru
          if (-not $app.WaitForExit(120000)) { Show-State "app did not exit in 120s"; Get-Process -Name "King3D" -ErrorAction SilentlyContinue | Stop-Process -Force; exit 1 }
          Get-Content $env:KING3D_DESKTOP_SMOKE_OUT
          if (-not (Select-String -Path $env:KING3D_DESKTOP_SMOKE_OUT -Pattern "SMOKE_OK" -Quiet)) { Show-State "smoke did not report SMOKE_OK"; exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: king3d-windows-installer
          path: apps/desktop/dist/*Setup*.exe
